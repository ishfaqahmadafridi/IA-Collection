services:
  frontend:
    build: ./Frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - media_data:/var/www/media:ro
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Set a generated SECRET_KEY in your environment or local .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      MEDIA_ROOT: /app/media
      CACHE_BACKEND: django.core.cache.backends.db.DatabaseCache
      CACHE_LOCATION: api_rate_limits
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    restart: unless-stopped
volumes:
  db_data:
  media_data:
