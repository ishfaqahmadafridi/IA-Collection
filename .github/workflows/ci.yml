name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate instructions and skill mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import filecmp
          root = Path('.')
          for name in ['AGENTS.md', 'CLAUDE.md', '.github/copilot-instructions.md']:
              assert (root / name).is_file(), name
          manifest = json.loads(Path('.claude/config.json').read_text())
          for rule in manifest['rules']:
              assert Path(rule).is_file(), rule
          for skill in manifest['skills']:
              source = Path('.agents/skills') / skill
              mirror = Path('.claude/skills') / skill
              assert (source / 'SKILL.md').is_file(), skill
              for path in source.rglob('*'):
                  if path.is_file():
                      other = mirror / path.relative_to(source)
                      assert other.is_file() and filecmp.cmp(path, other, shallow=False), str(other)
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
